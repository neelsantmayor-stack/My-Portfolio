<svg viewBox="0 0 400 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Accent Aura -->
    <radialGradient id="aura" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Skin Tone Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#df9d76" />
      <stop offset="100%" stop-color="#c17c54" />
    </linearGradient>
    
    <!-- Skin Shadow Gradient -->
    <linearGradient id="skinShadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8673f" />
      <stop offset="100%" stop-color="#804724" />
    </linearGradient>

    <!-- Suit Gradient -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    
    <!-- Tie Gradient -->
    <linearGradient id="tieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#580f0f" />
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="180" fill="url(#aura)" />

  <!-- Shoulders / Body (Suit Jacket) -->
  <path d="M 80,420 
           C 80,360 120,320 170,314 
           L 175,370
           L 200,385 
           L 225,370
           L 230,314 
           C 280,320 320,360 320,420
           L 325,500
           L 75,500
           Z" 
        fill="url(#suitGrad)" />
        
  <!-- Suit Shadows and Lapels -->
  <!-- Left Lapel -->
  <path d="M 125,320 
           L 175,370 
           L 170,480 
           L 110,380 
           Z" 
        fill="#475569" stroke="#334155" stroke-width="1" />
  
  <!-- Right Lapel -->
  <path d="M 275,320 
           L 225,370 
           L 230,480 
           L 290,380 
           Z" 
        fill="#475569" stroke="#334155" stroke-width="1" />

  <!-- Boutonniere Flower on Left Lapel -->
  <g transform="translate(138, 350)">
    <!-- Flower stem -->
    <path d="M 0,0 L 5,12" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <!-- Flower petals -->
    <circle cx="0" cy="-4" r="5" fill="#f43f5e" />
    <circle cx="-4" cy="0" r="4.5" fill="#e11d48" />
    <circle cx="4" cy="0" r="4.5" fill="#be123c" />
    <circle cx="0" cy="4" r="5" fill="#fda4af" />
    <circle cx="0" cy="0" r="3" fill="#fb7185" />
    <!-- Small Leaf -->
    <path d="M 3,8 C 8,8 10,4 8,0 C 6,4 4,6 3,8" fill="#10b981" />
  </g>

  <!-- Shirt V-Neck Area -->
  <path d="M 170,314 L 200,365 L 230,314 Z" fill="#f1f5f9" />
  <path d="M 175,314 L 200,380 L 225,314 Z" fill="#ffffff" />

  <!-- Neck -->
  <path d="M 175,260 C 175,300 185,320 200,320 C 215,320 225,300 225,260 Z" fill="url(#skinShadowGrad)" />
  <path d="M 178,260 C 178,295 188,310 200,310 C 212,310 222,295 222,260 Z" fill="url(#skinGrad)" />

  <!-- Shirt Collar Points -->
  <!-- Left Collar -->
  <path d="M 175,314 L 195,335 L 180,290 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <!-- Right Collar -->
  <path d="M 225,314 L 205,335 L 220,290 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />

  <!-- Burgundy Tie -->
  <g>
    <!-- Tie Knot -->
    <path d="M 194,324 L 206,324 L 203,342 L 197,342 Z" fill="url(#tieGrad)" stroke="#450a0a" stroke-width="0.5" />
    <!-- Tie Body -->
    <path d="M 196,342 L 204,342 L 212,460 L 200,480 L 188,460 Z" fill="url(#tieGrad)" stroke="#450a0a" stroke-width="0.5" />
    <!-- Tie Sheen/Details -->
    <path d="M 198,345 L 200,470 L 194,455 Z" fill="#b91c1c" opacity="0.3" />
  </g>

  <!-- Head / Face -->
  <!-- Main Face Shape -->
  <path d="M 140,190 
           C 140,110 260,110 260,190 
           C 260,250 240,270 200,270 
           C 160,270 140,250 140,190 
           Z" 
        fill="url(#skinGrad)" />

  <!-- Ears -->
  <!-- Left Ear -->
  <path d="M 140,185 C 132,185 132,205 140,210 Z" fill="url(#skinShadowGrad)" />
  <path d="M 140,190 C 135,190 135,202 140,205 Z" fill="url(#skinGrad)" />
  <!-- Right Ear -->
  <path d="M 260,185 C 268,185 268,205 260,210 Z" fill="url(#skinShadowGrad)" />
  <path d="M 260,190 C 265,190 265,202 260,205 Z" fill="url(#skinGrad)" />

  <!-- Nose -->
  <path d="M 200,185 C 195,185 194,215 194,220 C 194,222 200,224 200,224 C 200,224 206,222 206,220 C 206,215 205,185 200,185 Z" fill="url(#skinShadowGrad)" opacity="0.4" />
  <path d="M 200,190 C 197,190 196,215 196,218 C 196,219 200,221 200,221 C 200,221 204,219 204,218 C 204,215 203,190 200,190 Z" fill="url(#skinGrad)" />

  <!-- Eyes and Eyebrows -->
  <!-- Left Eyebrow -->
  <path d="M 155,170 Q 167,163 178,171" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <!-- Right Eyebrow -->
  <path d="M 222,171 Q 233,163 245,170" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" fill="none" />
  
  <!-- Left Eye -->
  <ellipse cx="168" cy="182" rx="8" ry="4.5" fill="#f8fafc" stroke="#475569" stroke-width="0.5" />
  <circle cx="168" cy="182" r="4.5" fill="#3b2314" />
  <circle cx="169.5" cy="180.5" r="1.5" fill="#ffffff" /> <!-- Highlight -->
  <path d="M 158,181 Q 168,175 178,181" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Right Eye -->
  <ellipse cx="232" cy="182" rx="8" ry="4.5" fill="#f8fafc" stroke="#475569" stroke-width="0.5" />
  <circle cx="232" cy="182" r="4.5" fill="#3b2314" />
  <circle cx="233.5" cy="180.5" r="1.5" fill="#ffffff" /> <!-- Highlight -->
  <path d="M 222,181 Q 232,175 242,181" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Mouth with Friendly Smile -->
  <path d="M 183,238 Q 200,252 217,238" stroke="#881337" stroke-width="3" stroke-linecap="round" fill="none" />
  <!-- Lip Highlight / Shadow -->
  <path d="M 185,240 Q 200,256 215,240" stroke="#fda4af" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Hair / Hairstyle (Neat, modern parted, dark hair) -->
  <path d="M 136,192 
           C 134,160 138,135 155,120 
           C 165,110 185,108 200,118 
           C 215,108 235,110 245,120 
           C 262,135 266,160 264,192 
           C 258,160 252,145 240,140 
           C 230,135 210,142 205,148 
           C 200,142 185,135 170,138 
           C 155,142 145,160 136,192 
           Z" 
        fill="url(#hairGrad)" />

  <!-- Small sleek stray fringe/part styling to resemble his photo -->
  <path d="M 198,118 
           Q 202,130 195,142 
           Q 205,135 207,118 
           Z" 
        fill="url(#hairGrad)" />
</svg>
